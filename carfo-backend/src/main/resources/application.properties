# ============================================================
# APPLICATION CARFO - Gestion des Missions
# ============================================================

# Profil actif (authentification/JWT activés)
spring.profiles.active=dev

# Server
server.port=8000

# ============================================================
# BASE DE DONNEES MySQL
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/theMission?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:serge}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================================
# JWT
# ============================================================
jwt.secret=carfo_missions_secret_key_very_long_and_secure_2024_change_in_production
jwt.expiration=86400000

# ============================================================
# CORS
# ============================================================
app.cors.allowed-origins=http://localhost:4200

# ============================================================
# UPLOAD (fiches de mission)
# ============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/

# ============================================================
# LOGGING
# ============================================================
logging.level.com.carfo=DEBUG
logging.level.org.springframework.security=INFO
